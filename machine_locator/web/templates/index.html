{% extends "base.html" %}
{% block title %}Placement map -- Machine Locator{% endblock %}
{% block body %}
<div class="layout">
  <aside class="sidebar">
    <div class="filters">
      <label>
        Minimum score
        <input type="range" id="min-score" min="0" max="100" value="60" step="5">
        <output id="min-score-out">60</output>
      </label>
      <label>
        Site type
        <select id="category">
          <option value="">Every type</option>
          {% for c in categories %}<option value="{{ c.key }}">{{ c.label }}</option>{% endfor %}
        </select>
      </label>
      <label>
        Search
        <input type="search" id="search" placeholder="name or street">
      </label>
      <p class="hint" id="result-count">Loading…</p>
      <p class="hint">
        No sites yet? Run <code>mloc locations find</code> in your terminal,
        then reload.
      </p>
    </div>
    <ol class="results" id="results"></ol>
  </aside>
  <main id="map"></main>
</div>
<div class="detail" id="detail" hidden>
  <button class="close" id="detail-close" aria-label="Close">×</button>
  <div id="detail-body"></div>
</div>
{% endblock %}
{% block scripts %}
<script>window.MAP_CENTER = {{ center|tojson }};</script>
<script src="{{ url_for('static', filename='map.js') }}"></script>
{% endblock %}

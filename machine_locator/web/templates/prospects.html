{% extends "base.html" %}
{% block title %}Prospects — Machine Locator{% endblock %}
{% block heading %}Prospects{% endblock %}
{% block topbar_actions %}
  <button class="btn btn-primary" id="btn-scan">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    Find prospects
  </button>
  <a class="btn" href="/download/prospects.csv">Export CSV</a>
  <a class="btn" href="/download/prospects.geojson">Map file</a>
{% endblock %}

{% block body %}
<div class="filters">
  <label>Min score
    <input type="range" id="f-score" min="0" max="100" step="5" value="60" style="width:130px">
    <output id="f-score-out" class="num" style="min-width:24px">60</output>
  </label>
  <label>Type
    <select id="f-category">
      <option value="">All types</option>
      {% for c in categories %}<option value="{{ c.key }}">{{ c.label }}</option>{% endfor %}
    </select>
  </label>
  <label>Grade
    <select id="f-grade">
      <option value="">Any</option>
      <option>A+</option><option>A</option><option>B</option><option>C</option><option>D</option>
    </select>
  </label>
  <label><input type="search" id="f-search" placeholder="Search name or street  ( / )"></label>
  <div class="spacer"></div>
  <span class="muted small" id="result-count">Loading…</span>
</div>

<div id="selection-bar" class="selection-bar" hidden>
  <strong><span id="sel-count">0</span> selected</strong>
  <div class="spacer"></div>
  <button class="btn btn-sm" id="btn-clear-sel">Clear</button>
  <button class="btn btn-sm btn-primary" id="btn-outreach-sel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
    Start outreach
  </button>
</div>

<div class="split">
  <div class="list-pane">
    <div class="list-head">
      <label class="pick"><input type="checkbox" id="sel-all"> Select all shown</label>
      <div class="spacer"></div>
      <span class="muted small">Click a row for detail</span>
    </div>
    <div class="result-list" id="results"></div>
  </div>
  <div class="map-pane"><div id="map"></div></div>
</div>
{% endblock %}

{% block scripts %}
<script>window.MAP_CENTER = {{ center|tojson }};</script>
<script src="{{ url_for('static', filename='js/prospects.js') }}"></script>
{% endblock %}

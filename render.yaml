# One-click deploy config for Render. Other hosts (Fly, Railway, Heroku) work
# the same way -- see DEPLOY.md.
services:
  - type: web
    name: machine-locator
    runtime: docker
    plan: starter          # the free plan has no persistent disk; see below
    healthCheckPath: /login
    envVars:
      # Generated once by Render and kept. This is the password you sign in with.
      - key: MACHINE_LOCATOR_PASSWORD
        generateValue: true
      - key: MACHINE_LOCATOR_SECRET_KEY
        generateValue: true
      # Tells the app it is behind HTTPS, so the session cookie is marked secure.
      - key: MACHINE_LOCATOR_HTTPS
        value: "1"
      - key: MACHINE_LOCATOR_HOME
        value: /data
      # Your mail password. Set this yourself in the dashboard -- never commit it.
      - key: MACHINE_LOCATOR_SMTP_PASSWORD
        sync: false
    disk:
      name: machine-locator-data
      mountPath: /data
      sizeGB: 1
